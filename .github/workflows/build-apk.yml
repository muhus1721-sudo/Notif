# Builds the Event Tickets Android APK and attaches it to a GitHub Release, so
# the app can be installed straight from a phone browser with no local tooling.
#
# Run it from the Actions tab ("Run workflow"), or let a push do it.
name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK with ANDROID_HOME set and licences
      # accepted. android-actions/setup-android@v3 now fails there trying to
      # install the long-retired 'tools' package, so it is not used.

      - name: Install dependencies
        run: npm ci

      - name: Check types and run tests
        run: |
          npm run typecheck
          npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      # Same trade-offs as the Reminders build: the release build type signs
      # with the bundled debug keystore (fine for installing on your own
      # phones), arm64-v8a only, and no R8 — Expo finds its native modules by
      # class name, and a minification mistake would only show up when the app
      # is opened.
      - name: Assemble release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify the packaged APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          set -uo pipefail
          fail() { echo "VERIFY FAILED: $1"; exit 1; }

          unzip -l app-release.apk | grep -q 'lib/arm64-v8a/libreactnative.so' \
            || fail "arm64 engine missing"
          unzip -l app-release.apk | grep 'assets/index.android.bundle' \
            || fail "JS bundle missing"

          rm -rf dexcheck && mkdir dexcheck
          unzip -o -q app-release.apk 'classes*.dex' -d dexcheck || fail "no dex files"
          for module in imagepicker sharing filesystem; do
            grep -qa "expo.modules.$module" dexcheck/*.dex \
              || fail "$module module missing from dex"
          done
          rm -rf dexcheck

          echo "OK: arm64 engine, JS bundle, picker/sharing/file-system modules present"
          ls -lh app-release.apk

      - name: Name the APK after the run
        id: apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/EventTickets-${{ github.run_number }}.apk"
          echo "path=dist/EventTickets-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: event-tickets-apk
          path: ${{ steps.apk.outputs.path }}

      # Tagged tickets-apk-N so it never collides with the old Reminders
      # releases (apk-N) still on the repository.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tickets-apk-${{ github.run_number }}" \
            "${{ steps.apk.outputs.path }}" \
            --target "${{ github.sha }}" \
            --title "Event Tickets - build ${{ github.run_number }}" \
            --notes "Tap the .apk below on an Android phone to install. Android will ask you to allow installing from your browser; that is expected for an app that does not come from the Play Store. Built for arm64 phones (anything from roughly 2015 onward). Built from ${{ github.sha }}." \
            --latest

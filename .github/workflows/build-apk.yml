# Builds an installable Android APK and attaches it to a GitHub Release, so the
# app can be installed straight from a phone browser with no local tooling.
#
# Run it from the Actions tab ("Run workflow"), or let a push do it.
name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'civilaid/**', '.github/workflows/civilaid-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
      # android-actions/setup-android@v3 now fails there ("Failed to find package 'tools'").

      - name: Install dependencies
        run: npm ci

      - name: Check types and run tests
        run: |
          npm run typecheck
          npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      # The generated release build type signs with the bundled debug keystore,
      # which is enough to install on a personal device.
      #
      # A universal APK carries the engine compiled for all four ABIs — roughly
      # 41 MB of native code no single phone can use. arm64-v8a covers every
      # Android phone since ~2015 and is pure dead-weight removal.
      #
      # R8 minification would save perhaps 8 MB more, but it also renames
      # classes, and Expo resolves its native modules reflectively by name. A
      # mistake there fails when the app is opened rather than when it is built,
      # and nothing in CI actually launches the app — so the trade is refused:
      # a reminder that silently never fires is worse than 8 MB.
      - name: Assemble release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify the packaged APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          set -uo pipefail
          fail() { echo "VERIFY FAILED: $1"; exit 1; }

          echo "--- ABIs included ---"
          unzip -l app-release.apk | grep -o 'lib/[^/]*' | sort -u
          extra=$(unzip -l app-release.apk | grep -o 'lib/[^/]*' | sort -u | grep -v 'lib/arm64-v8a' || true)
          [ -z "$extra" ] || fail "unexpected ABI: $extra"
          unzip -l app-release.apk | grep -q 'lib/arm64-v8a/libreactnative.so' \
            || fail "arm64 engine missing"

          unzip -l app-release.apk | grep 'assets/index.android.bundle' \
            || fail "JS bundle missing"

          # Without minification class names are not renamed, so their absence
          # from the dex string pool is a real signal rather than obfuscation.
          rm -rf dexcheck && mkdir dexcheck
          unzip -o -q app-release.apk 'classes*.dex' -d dexcheck || fail "no dex files"
          echo "dex files: $(ls dexcheck | tr '\n' ' ')"
          grep -qa 'expo.modules.notifications' dexcheck/*.dex \
            || fail "notifications module missing from dex"
          rm -rf dexcheck

          echo "OK: arm64 only, JS bundle present, notifications module retained"
          ls -lh app-release.apk

      - name: Name the APK after the run
        id: apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/Reminders-${{ github.run_number }}.apk"
          echo "path=dist/Reminders-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: reminders-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "Reminders - build ${{ github.run_number }}" \
            --notes "Tap the .apk below on an Android phone to install. Android will ask you to allow installing from your browser; that is expected for an app that does not come from the Play Store. Built for arm64 phones (anything from roughly 2015 onward). Built from ${{ github.sha }}." \
            --latest

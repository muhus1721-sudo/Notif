# Builds the Event Tickets Android APK and attaches it to a GitHub Release, so
# the app can be installed straight from a phone browser with no local tooling.
#
# The app lives in welcome-event-tickets/ for now. If it moves to its own
# repository, move this file to that repo's .github/workflows/ and drop the
# APP_DIR prefixes (set APP_DIR to '.').
name: Build Tickets APK

on:
  push:
    branches: ['**']
    paths:
      - 'welcome-event-tickets/**'
      - '.github/workflows/build-tickets-apk.yml'
      - '!welcome-event-tickets/README.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_DIR: welcome-event-tickets

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: welcome-event-tickets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Check types and run tests
        run: |
          npm run typecheck
          npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      # Same trade-offs as the Reminders build: the release build type signs
      # with the bundled debug keystore (fine for installing on your own
      # phones), arm64-v8a only, and no R8 — Expo finds its native modules by
      # class name, and a minification mistake would only show up when the app
      # is opened.
      - name: Assemble release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify the packaged APK
        working-directory: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release
        run: |
          set -uo pipefail
          fail() { echo "VERIFY FAILED: $1"; exit 1; }

          unzip -l app-release.apk | grep -q 'lib/arm64-v8a/libreactnative.so' \
            || fail "arm64 engine missing"
          unzip -l app-release.apk | grep 'assets/index.android.bundle' \
            || fail "JS bundle missing"

          rm -rf dexcheck && mkdir dexcheck
          unzip -o -q app-release.apk 'classes*.dex' -d dexcheck || fail "no dex files"
          for module in imagepicker sharing filesystem; do
            grep -qa "expo.modules.$module" dexcheck/*.dex \
              || fail "$module module missing from dex"
          done
          rm -rf dexcheck

          echo "OK: arm64 engine, JS bundle, picker/sharing/file-system modules present"
          ls -lh app-release.apk

      - name: Name the APK after the run
        id: apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/EventTickets-${{ github.run_number }}.apk"
          echo "path=${{ env.APP_DIR }}/dist/EventTickets-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: event-tickets-apk
          path: ${{ steps.apk.outputs.path }}

      # Tagged tickets-apk-N so it never collides with the Reminders releases.
      # Not marked "latest", so the Reminders app's latest release stays put.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tickets-apk-${{ github.run_number }}" \
            "${{ github.workspace }}/${{ steps.apk.outputs.path }}" \
            --target "${{ github.sha }}" \
            --title "Event Tickets - build ${{ github.run_number }}" \
            --notes "Tap the .apk below on an Android phone to install. Android will ask you to allow installing from your browser; that is expected for an app that does not come from the Play Store. Built for arm64 phones (anything from roughly 2015 onward). Built from ${{ github.sha }}." \
            --latest=false
